services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buffer-ai-content-automation
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./dev.db}
      PORT: ${PORT:-3000}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - db-data:/app/prisma
      - logs-data:/app/logs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional PostgreSQL database for production deployments.
  # Enable with: docker compose --profile postgres up -d
  # Then run "npm run db:use:postgres", set DATABASE_URL to
  # postgresql://buffer:buffer@postgres:5432/buffer_ai in .env, and restart.
  postgres:
    image: postgres:16-alpine
    container_name: buffer-ai-postgres
    restart: unless-stopped
    profiles: ['postgres']
    environment:
      POSTGRES_USER: buffer
      POSTGRES_PASSWORD: buffer
      POSTGRES_DB: buffer_ai
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  db-data:
  logs-data:
  postgres-data:
