name: Hourly Buffer Automation

# Runs fully unattended, once an hour, with zero manual intervention.
# Each run generates one theme + one hero image and schedules it across
# LinkedIn, Twitter, and Instagram (see SchedulerService.runHourlyAutomation).
#
# Persistence note: GitHub-hosted runners are ephemeral, so the default
# SQLite database file does not survive between runs on its own. This
# workflow caches prisma/data/dev.db between runs as a best-effort way to
# keep post history (needed for duplicate detection) across runs. For a
# production deployment, prefer setting DATABASE_URL to a persistent
# PostgreSQL instance (see README "Switching to PostgreSQL") — that removes
# any dependency on the cache and is the recommended production setup.
on:
  # Deliberately not "0 * * * *": GitHub Actions queues scheduled workflows
  # against every other repo's top-of-hour jobs, and this repo's runs were
  # observed being delayed/dropped when aligned to :00 (see
  # https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule).
  # Minute :07 avoids that congestion while still giving an exact hourly cadence.
  #
  # GitHub Actions `schedule` cron always runs in UTC (no per-workflow
  # timezone support) - it fires at :07 UTC every hour, which is :37 IST
  # (Asia/Kolkata, UTC+5:30). The pipeline's own content/logging still uses
  # IST for "morning/afternoon/evening" labeling via TIMEZONE below.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hourly-buffer-automation
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    env:
      # Needed by every Prisma step (generate/db push), not just the final
      # script — hoisted to job level so it's never missing partway through.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}
    steps:
      - name: Record run start time
        id: start_time
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Harmless no-op if DATABASE_URL is set to Postgres instead (the path
      # just won't exist to cache/restore). `secrets.*` can't be referenced
      # directly in `if:` conditions, so this isn't gated on that.
      - name: Restore SQLite database (best-effort persistence across runs)
        uses: actions/cache@v4
        with:
          path: prisma/dev.db
          key: sqlite-db-${{ github.run_id }}
          restore-keys: |
            sqlite-db-

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync database schema
        run: npx prisma db push --skip-generate

      - name: Generate and schedule this hour's post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PORT: 3000
          TIMEZONE: Asia/Kolkata
        run: npm run generate:hourly

      # GitHub's own `schedule:` trigger (above) is best-effort and can be
      # delayed or dropped by hours during high platform load. To hold a real
      # hourly cadence, each run instead re-triggers itself on-demand
      # (workflow_dispatch, which isn't subject to that queuing delay) after
      # sleeping out the rest of the hour. `if: always()` so a failed post
      # this hour doesn't break next hour's chain. Requires the DISPATCH_TOKEN
      # repo secret (a PAT with Actions read/write) - GITHUB_TOKEN can't be
      # used here since GitHub blocks it from starting new workflow runs, to
      # prevent recursive-trigger loops.
      - name: Sleep until next hourly slot
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.start_time.outputs.start_epoch }} ))
          sleep_for=$(( 3600 - elapsed ))
          if [ "$sleep_for" -gt 0 ]; then
            echo "Sleeping ${sleep_for}s to hold the hourly cadence"
            sleep "$sleep_for"
          fi

      - name: Trigger next hourly run
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "DISPATCH_TOKEN secret not set; relying on the schedule trigger only (see repo Settings > Secrets and variables > Actions)" >&2
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hourly-automation.yml/dispatches" \
            -d '{"ref":"main"}'
