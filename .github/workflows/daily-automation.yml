name: Daily Buffer Automation

# Runs fully unattended, once a day, with zero manual intervention.
#
# Timing: 07:00 in Asia/Kolkata (IST, UTC+5:30) == 01:30 UTC.
#
# Persistence note: GitHub-hosted runners are ephemeral, so the default
# SQLite database file does not survive between runs on its own. This
# workflow caches prisma/data/dev.db between runs as a best-effort way to
# keep post history (needed for duplicate detection) across days. For a
# production deployment, prefer setting DATABASE_URL to a persistent
# PostgreSQL instance (see README "Switching to PostgreSQL") — that removes
# any dependency on the cache and is the recommended production setup.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-buffer-automation
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    env:
      # Needed by every Prisma step (generate/db push), not just the final
      # script — hoisted to job level so it's never missing partway through.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Harmless no-op if DATABASE_URL is set to Postgres instead (the path
      # just won't exist to cache/restore). `secrets.*` can't be referenced
      # directly in `if:` conditions, so this isn't gated on that.
      - name: Restore SQLite database (best-effort persistence across runs)
        uses: actions/cache@v4
        with:
          path: prisma/dev.db
          key: sqlite-db-${{ github.run_id }}
          restore-keys: |
            sqlite-db-

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync database schema
        run: npx prisma db push --skip-generate

      - name: Generate and schedule today's posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PORT: 3000
          TIMEZONE: Asia/Kolkata
        run: npm run generate:daily
